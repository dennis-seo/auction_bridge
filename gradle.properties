# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9.0+ KMP 호환 우회 (deprecated 경고 OK, 미래 모듈 분리로 제거)
android.builtInKotlin=false
android.newDsl=false

# ===== Kakao Map Keys =====
# 이 파일은 git 에 커밋되므로 실제 키 값을 절대 적지 말 것.
# 실제 값은 local.properties (gitignored) 에 동일 키로 작성하면 자동으로 우선 적용된다.
# 빌드 시 lookup 순서: local.properties → 환경변수 → gradle.properties
# (composeApp/build.gradle.kts 의 `secret()` 참조)
KAKAO_NATIVE_APP_KEY=
