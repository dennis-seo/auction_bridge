<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SPA — sub-path 새로고침 시 Compose Resources(./composeResources/...) 같은
         상대 경로 자산이 /map/composeResources/... 로 잘못 리졸브되는 것을 방지 -->
    <base href="/" />
    <title>Auction Bridge</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
        body { background-color: #FFFFFF; }
        /* 카카오 지도가 렌더링될 컨테이너 (DOM 오버레이 방식)
           Compose 의 KakaoMapView 가 onGloballyPositioned 로 실제 좌표/크기를 갱신.
           Phase 1: z-index 0 (Compose canvas 뒤) — 시각만 노출, 입력은 Phase 2. */
        /* z-index: -1 — Compose canvas 뒤로 강제. canvas 가 위치 속성 부재로 stacking 우선순위가
           낮아져 div 가 위로 올라가는 케이스 회피. */
        #kakao-map { position: absolute; inset: 0; z-index: -1; display: none; }
        /* 매물 말풍선 — KakaoMapView.wasmJs 의 CustomOverlay content 로 사용. 2줄 구조. */
        .auction-bubble {
            display: inline-block;
            padding: 5px 10px 6px;
            border-radius: 14px;
            background: #1565C0;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            transform: translateY(-6px);
            text-align: center;
            line-height: 1.15;
        }
        .auction-bubble .category {
            color: #FFD740;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85), 0 0 1px rgba(0, 0, 0, 0.65);
        }
        .auction-bubble .price {
            color: #FFFFFF;
            font-size: 12px;
            font-weight: 600;
            margin-top: 1px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7), 0 0 1px rgba(0, 0, 0, 0.5);
        }
        .auction-bubble::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid #1565C0;
        }
    </style>
    <!--
        Kakao Maps JS SDK Loader
        autoload=false 후 main.kt에서 kakao.maps.load { ... } 로 사용
        @KAKAO_JS_KEY@ 는 빌드 타임에 local.properties 의 KAKAO_JS_KEY 로 치환됨
    -->
    <script
        type="text/javascript"
        src="//dapi.kakao.com/v2/maps/sdk.js?appkey=@KAKAO_JS_KEY@&autoload=false"></script>
</head>
<body>
<div id="kakao-map"></div>
<!-- 절대 경로 사용 — /map/apartment 같은 sub-path 에서 새로고침 시
     브라우저가 상대 경로를 /map/composeApp.js 로 잘못 리졸브하는 문제 방지 -->
<script src="/composeApp.js"></script>
</body>
</html>
